<style>
/* VOICE warm, encouraging, kid-readable; IDEA a practice notebook from a music class
   COLOUR kumkum maroon + turmeric + ivory paper; TYPE Baloo 2 headings, Noto Sans body (diacritics)
   LAYOUT top bar, one column cards, bottom tab bar on phones, side-by-side cards on wide screens */
:root{--bg:#fbf6ec;--card:#fff;--ink:#2a1a14;--mute:#6f5d52;--line:#eadfcd;--maroon:#7a1e2c;--maroon2:#9b2c3c;--gold:#e0a21b;--goldbg:#fdf1d4;--green:#2f7d4f;--greenbg:#e3f3e8;--amber:#b46a00;--amberbg:#fff0d6;--red:#b3261e;--redbg:#fde7e5;--blue:#2c5a8c;--shadow:0 1px 2px rgba(60,30,10,.08),0 4px 14px rgba(60,30,10,.06)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1;margin:0 0 .4em}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}
a{color:var(--maroon2)}
button,select,input,textarea{font:inherit;font-size:16px}
header.top{position:sticky;top:0;z-index:20;background:var(--maroon);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px}
header.top .logo{font-family:"Baloo 2";font-size:21px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;border:0;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;min-height:34px}
.chip.on{background:var(--gold);color:#2a1a14}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.grid2>.card{margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--maroon);background:#fff;color:var(--maroon);font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--maroon);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1a14}
.btn.big{min-height:60px;font-size:18px;border-radius:16px;padding:12px 22px}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.big-n{font-family:"Baloo 2";font-size:44px;line-height:1;font-weight:700;color:var(--maroon)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.lv-new{background:#efe9e0;color:#6f5d52}.lv-learning{background:var(--redbg);color:var(--red)}.lv-shaky{background:var(--amberbg);color:var(--amber)}.lv-ready{background:var(--greenbg);color:var(--green)}
.bar{height:10px;border-radius:99px;background:#f0e7d8;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item-chip{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;cursor:pointer;min-height:44px;text-align:left;display:flex;flex-direction:column;gap:2px}
.item-chip b{font-weight:600;font-size:15px}
.item-chip.ready{border-color:#9fd1b1;background:#f3fbf6}.item-chip.shaky{border-color:#f0c780;background:#fffaf0}.item-chip.learning{border-color:#f0b0aa;background:#fff7f6}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.meta dt{color:var(--mute)}.meta dd{margin:0;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--mute);font-size:12px;font-weight:600}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--maroon)}
.modal-bg{position:fixed;inset:0;background:rgba(30,15,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--maroon)}
.rec-btn{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 0 0 6px var(--redbg)}
.rec-btn.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px var(--redbg)}}
@media (prefers-reduced-motion:reduce){.rec-btn.on{animation:none}}
.tuner{display:flex;align-items:center;gap:14px}
.tuner .sw{font-family:"Baloo 2";font-size:38px;font-weight:700;width:90px;text-align:center}
.needle{flex:1;height:26px;border-radius:99px;background:linear-gradient(90deg,var(--redbg),var(--greenbg) 40%,var(--greenbg) 60%,var(--redbg));position:relative}
.needle i{position:absolute;top:-4px;width:4px;height:34px;background:var(--ink);border-radius:2px;left:50%;transition:left .08s}
.score-ring{width:92px;height:92px;flex:none}
canvas.graph{width:100%;height:220px;display:block;background:#fffdf8;border:1px solid var(--line);border-radius:12px}
.tala-row{display:flex;flex-wrap:wrap;gap:6px}
.beat{min-width:58px;padding:10px 6px;border-radius:10px;background:#fff;border:1.5px solid var(--line);text-align:center;font-weight:600;font-size:14px}
.beat.now{background:var(--gold);border-color:var(--gold)}
.beat small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.stepper output{min-width:56px;text-align:center;font-weight:700;font-size:18px}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .q{font-family:"Baloo 2";font-size:24px}
.flash .a{font-size:20px;font-weight:600;color:var(--maroon)}
.lotus{display:inline-block;width:22px;height:22px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--amberbg);color:#6a3e00}.banner.info{background:var(--goldbg)}
.hide{display:none!important}
.timer{font-family:"Baloo 2";font-size:22px;font-weight:700}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start!important;width:auto!important}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:13px}h1{font-size:26px}.big-n{font-size:38px}main{padding:12px}}
@media(min-width:900px){nav.tabs{top:0;bottom:auto;left:auto;right:16px;width:auto;grid-template-columns:repeat(5,auto);background:transparent;border:0;padding:calc(env(safe-area-inset-top) + 6px) 0 0}nav.tabs a{color:#f3d9dd;flex-direction:row;gap:6px;padding:10px 12px;font-size:14px}nav.tabs a.on{color:#fff;text-decoration:underline;text-underline-offset:6px}nav.tabs a svg{width:20px;height:20px}header.top{padding-right:540px}body{padding-bottom:20px}}
</style>
</head>

/* ====================== STORAGE (IndexedDB, offline-first) ====================== */
let db;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('sangeeta-prep',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('audio'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function iget(store,key){ return new Promise((res,rej)=>{ const t=db.transaction(store).objectStore(store).get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
function iput(store,key,val){ return new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idel(store,key){ return new Promise((res)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }

const blankState = () => ({ schema:1, settings:{guru:'', sa:392, bhajan:null, u:0}, links:{}, attempts:{}, facts:{}, sessions:{}, mocks:{} });
let S = blankState();
/* every record: {id, u (updated ms), ...}; merge = union by id, newer u wins */
function mergeState(a,b){
  const out = blankState();
  out.settings = (b.settings?.u||0) > (a.settings?.u||0) ? {...a.settings,...b.settings} : {...b.settings,...a.settings};
  for (const k of ['attempts','facts','sessions','mocks']) { out[k]={...(a[k]||{})}; for (const [id,r] of Object.entries(b[k]||{})) if(!out[k][id] || (r.u||0)>(out[k][id].u||0)) out[k][id]=r; }
  out.links={...(a.links||{})}; for (const [id,r] of Object.entries(b.links||{})) if(!out.links[id] || (r.u||0)>(out.links[id].u||0)) out.links[id]=r;
  return out;
}
let saveT;
function persist(){ clearTimeout(saveT); saveT=setTimeout(async()=>{ try{ await iput('kv','state',S); }catch(e){ console.error(e); } scheduleSync(); },150); }
function put(coll, rec){ rec.u=now(); S[coll][rec.id]=rec; persist(); return rec; }

const DRIVE = { token:null, exp:0, folder:null, recFolder:null, fileId:null, busy:false, last:0, err:null, gis:false };
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const clientId = () => CONFIG.clientId || ls.get('sp_clientId') || '';
function loadGis(){ return new Promise((res,rej)=>{ if(window.google?.accounts?.oauth2) return res(); const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load Google sign-in (offline?)')); document.head.appendChild(s); }); }
let tokenClient;
async function connectDrive(interactive=true){
  if(!clientId()){ if(interactive){ location.hash='#settings'; toast('Add your Google Client ID first (see SETUP.md)'); } return false; }
  try { await loadGis(); } catch(e){ toast(e.message); return false; }
  return new Promise(res=>{
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id:clientId(), scope:'https://www.googleapis.com/auth/drive.file',
      callback: r=>{ if(r.error){ DRIVE.err=r.error; renderSync(); return res(false); } DRIVE.token=r.access_token; DRIVE.exp=now()+(r.expires_in-120)*1000; ls.set('sp_tok',JSON.stringify({t:DRIVE.token,e:DRIVE.exp})); ls.set('sp_connected','1'); DRIVE.err=null; renderSync(); sync(); res(true); },
      error_callback: e=>{ DRIVE.err=e.type||'popup'; renderSync(); res(false); } });
    tokenClient.requestAccessToken({prompt: ls.get('sp_connected')?'':'consent'});

}
function tokenOk(){ return DRIVE.token && now()<DRIVE.exp; }
async function gapi(method,url,body,headers={}){
  const r = await fetch(url,{method,headers:{Authorization:'Bearer '+DRIVE.token,...headers},body});
  if(r.status===401){ DRIVE.token=null; renderSync(); throw new Error('auth'); }
  if(!r.ok) throw new Error('Drive '+r.status+': '+(await r.text()).slice(0,200));
  return r;
}
const API='https://www.googleapis.com/drive/v3/files', UP='https://www.googleapis.com/upload/drive/v3/files';
async function findFile(name,parent,folder){
  const q = `name='${name.replace(/'/g,"\\'")}' and trashed=false`+(parent?` and '${parent}' in parents`:'')+(folder?` and mimeType='application/vnd.google-apps.folder'`:'');
  const r = await (await gapi('GET',API+'?spaces=drive&fields=files(id,name,modifiedTime)&q='+encodeURIComponent(q))).json();
  return r.files?.[0]?.id||null;
}
async function mkFolder(name,parent){ const r=await gapi('POST',API+'?fields=id',JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined}),{'Content-Type':'application/json'}); return (await r.json()).id; }
async function upload(meta,blob,mime){
  const b='spb'+uid(); const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,blob,`\r\n--${b}--`]);
  const r=await gapi('POST',UP+'?uploadType=multipart&fields=id',body,{'Content-Type':'multipart/related; boundary='+b}); return (await r.json()).id;
}
async function ensureFolders(){
  if(!DRIVE.folder){ DRIVE.folder = ls.get('sp_folder') || await findFile('Sangeeta Prep',null,true) || await mkFolder('Sangeeta Prep'); ls.set('sp_folder',DRIVE.folder); }
  if(!DRIVE.recFolder){ DRIVE.recFolder = ls.get('sp_recfolder') || await findFile('recordings',DRIVE.folder,true) || await mkFolder('recordings',DRIVE.folder); ls.set('sp_recfolder',DRIVE.recFolder); }
}
let syncT; function scheduleSync(){ clearTimeout(syncT); syncT=setTimeout(sync,3000); }
async function sync(){
  if(!tokenOk()||DRIVE.busy||!navigator.onLine){ renderSync(); return; }
  DRIVE.busy=true; renderSync();
  try{
    try { await ensureFolders(); } catch(e){ if(String(e.message).includes('404')){ ls.set('sp_folder',''); ls.set('sp_recfolder',''); DRIVE.folder=DRIVE.recFolder=null; await ensureFolders(); } else throw e; }
    DRIVE.fileId = DRIVE.fileId || await findFile('progress.json',DRIVE.folder);
    if(DRIVE.fileId){ const remote = await (await gapi('GET',API+'/'+DRIVE.fileId+'?alt=media')).json(); S = mergeState(S, remote); }
    await uploadPendingAudio();
    await enforceRetention();
    const json = JSON.stringify(S);
    if(DRIVE.fileId) await gapi('PATCH',UP+'/'+DRIVE.fileId+'?uploadType=media',json,{'Content-Type':'application/json'});
    else DRIVE.fileId = await upload({name:'progress.json',parents:[DRIVE.folder]},new Blob([json]),'application/json');
    const today = dayKey(now());
    if(ls.get('sp_snap')!==today){ const nm='progress-'+today+'.json'; if(!(await findFile(nm,DRIVE.folder))) await upload({name:nm,parents:[DRIVE.folder]},new Blob([json]),'application/json'); ls.set('sp_snap',today); }
    await iput('kv','state',S);
    DRIVE.last=now(); DRIVE.err=null;
  }catch(e){ console.error(e); DRIVE.err = e.message==='auth'?null:e.message; }
  DRIVE.busy=false; renderSync(); if(curView!=='mockrun') rerenderSoft();
}
async function uploadPendingAudio(){
  for(const a of Object.values(S.attempts)){
    if(a.audio && !a.audio.drive && !a.audio.deleted){
      const rec = await iget('audio',a.id); if(!rec) continue;
      const ext = rec.type.includes('mp4')?'m4a':rec.type.includes('ogg')?'ogg':'webm';
      const nm = `${a.item}_${dayKey(a.ts)}_${a.id}.${ext}`;
      a.audio.drive = await upload({name:nm,parents:[DRIVE.recFolder]},rec,rec.type||'audio/webm'); a.u=now();
    }
    if(a.audio?.pendingDel && a.audio.drive){ try{ await gapi('DELETE',API+'/'+a.audio.drive); }catch(e){ if(e.message==='auth') throw e; } a.audio.drive=null; a.audio.pendingDel=false; a.u=now(); }
  }
}
async function enforceRetention(){
  const by={}; for(const a of Object.values(S.attempts)) if(a.audio && !a.audio.deleted) (by[a.item]=by[a.item]||[]).push(a);
  for(const list of Object.values(by)){ list.sort((x,y)=>y.ts-x.ts); for(const a of list.slice(2)){ await idel('audio',a.id); a.audio.deleted=true; if(a.audio.drive){ if(tokenOk()){ try{ await gapi('DELETE',API+'/'+a.audio.drive); a.audio.drive=null; }catch(e){ a.audio.pendingDel=true; } } else a.audio.pendingDel=true; } a.u=now(); } }
}
async function audioUrl(a){
  if(!a.audio||a.audio.deleted) return null;
  const b = await iget('audio',a.id); if(b) return URL.createObjectURL(b);
  if(a.audio.drive && tokenOk()){ const r=await gapi('GET',API+'/'+a.audio.drive+'?alt=media'); const bl=await r.blob(); await iput('audio',a.id,bl); return URL.createObjectURL(bl); }
  return null;
}

let AC;
function ctx(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){} return AC; }
let tanpura = {on:false,timer:null,gain:null,next:0,i:0,wave:null};
function tanpuraWave(c){ if(tanpura.wave) return tanpura.wave; const n=24, re=new Float32Array(n), im=new Float32Array(n); for(let k=1;k<n;k++){ im[k]=Math.pow(k,-0.9)*(k%2?1:0.8)*(k>6&&k<14?1.6:1); } tanpura.wave=c.createPeriodicWave(re,im); return tanpura.wave; }
function pluck(c,f,t,dur=3.6,amp=0.18){
  const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain();
  o.setPeriodicWave(tanpuraWave(c)); o2.setPeriodicWave(tanpuraWave(c)); o.frequency.value=f; o2.frequency.value=f*1.0017;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(amp,t+0.02); g.gain.exponentialRampToValueAtTime(amp*0.5,t+0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); o2.connect(g); g.connect(tanpura.gain); o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function tanpuraStart(){
  const c=ctx(); const sa=S.settings.sa||392;
  tanpura.gain=c.createGain(); tanpura.gain.gain.value=(+ls.get('sp_tvol')||0.7); tanpura.gain.connect(c.destination);
  const seq=[sa*0.75, sa, sa, sa/2]; // mandra Pa, Sa, Sa, mandra Sa
  const gaps=[1.0,0.55,0.55,1.4];
  tanpura.next=c.currentTime+0.05; tanpura.i=0; tanpura.on=true;
  const tick=()=>{ while(tanpura.next < c.currentTime+0.6){ pluck(c,seq[tanpura.i],tanpura.next); tanpura.next+=gaps[tanpura.i]; tanpura.i=(tanpura.i+1)%4; } };
  tick(); tanpura.timer=setInterval(tick,150); updTanpuraChip();
}
function tanpuraStop(){ clearInterval(tanpura.timer); tanpura.on=false; if(tanpura.gain){ const g=tanpura.gain; g.gain.setTargetAtTime(0,ctx().currentTime,0.15); setTimeout(()=>g.disconnect(),800); } updTanpuraChip(); }
function updTanpuraChip(){ const c=$('#tanpuraChip'); c.classList.toggle('on',tanpura.on); c.setAttribute('aria-pressed',tanpura.on); c.textContent= tanpura.on?'Tanpura G ●':'Tanpura G'; }
$('#tanpuraChip').onclick=()=>{ tanpura.on?tanpuraStop():tanpuraStart(); };
function click(c,t,strong){ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=strong?1400:900; g.gain.setValueAtTime(strong?0.5:0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.08); }

/* ====================== PITCH ANALYSIS ====================== */
function yin(x,off,W,minT,maxT,fs,d,cm){
  for(let t=1;t<=maxT;t++){ let s=0; for(let j=0;j<W;j++){ const v=x[off+j]-x[off+j+t]; s+=v*v; } d[t]=s; }
  let run=0; cm[0]=1; for(let t=1;t<=maxT;t++){ run+=d[t]; cm[t]= run? d[t]*t/run : 1; }
  let tau=-1;
  for(let t=minT;t<=maxT;t++){ if(cm[t]<0.15){ while(t+1<=maxT && cm[t+1]<cm[t]) t++; tau=t; break; } }
  if(tau<0){ let b=minT; for(let t=minT;t<=maxT;t++) if(cm[t]<cm[b]) b=t; if(cm[b]<0.3) tau=b; else return 0; }
  let tt=tau; if(tau>1 && tau<maxT){ const a=cm[tau-1],b=cm[tau],c=cm[tau+1],den=a-2*b+c; if(den) tt=tau+0.5*(a-c)/den; }
  return fs/tt;
}
function decimate(x,sr){ const f=Math.max(1,Math.round(sr/11025)); const n=Math.floor(x.length/f); const y=new Float32Array(n); for(let i=0;i<n;i++){ let s=0; for(let k=0;k<f;k++) s+=x[i*f+k]; y[i]=s/f; } return {y,fs:sr/f}; }
async function analyzeSamples(raw,sr,saHz,allowed,opts={}){
  const {y,fs}=decimate(raw,sr); const W=512, maxT=Math.floor(fs/100), minT=Math.max(2,Math.floor(fs/1300)), hop=Math.round(fs*0.04);
  const nF=Math.max(0,Math.floor((y.length-W-maxT)/hop)); const d=new Float32Array(maxT+1), cm=new Float32Array(maxT+1);
  const rms=new Float32Array(nF); for(let i=0;i<nF;i++){ let s=0; const o=i*hop; for(let j=0;j<W;j++) s+=y[o+j]*y[o+j]; rms[i]=Math.sqrt(s/W); }
  const sorted=[...rms].sort((a,b)=>a-b); const p95=sorted[Math.floor(sorted.length*0.95)]||0; const gate=Math.max(0.004,p95*0.12);
  const cents=new Float32Array(nF).fill(NaN);
  for(let i=0;i<nF;i++){ if(rms[i]<gate) continue; const f=yin(y,i*hop,W,minT,maxT,fs,d,cm); if(f>0) cents[i]=1200*Math.log2(f/saHz); if(opts.yieldEvery && i%opts.yieldEvery===0) await new Promise(r=>setTimeout(r)); }
  // median-of-3 smoothing to remove octave blips
  const c2=new Float32Array(nF).fill(NaN); for(let i=1;i<nF-1;i++){ const a=[cents[i-1],cents[i],cents[i+1]]; if(a.some(isNaN)){ c2[i]=cents[i]; continue; } a.sort((p,q)=>p-q); c2[i]=a[1]; }
  return summarize(c2,hop/fs,nF*hop/fs,saHz,allowed,opts);
}
function nearest(cls,allowed){ let best=null,bd=1e9; for(const n of allowed){ for(const p of [SW[n],SW[n]+1200,SW[n]-1200]){ const dd=cls-p; if(Math.abs(dd)<Math.abs(bd)){ bd=dd; best=n; } } } return {n:best,dev:bd}; }
function summarize(c,dt,dur,saHz,allowed,opts){
  const voiced=[]; for(let i=0;i<c.length;i++) if(!isNaN(c[i])) voiced.push(i);
  const res={dur,voicedPct:c.length?voiced.length/c.length:0,score:null,tips:[],track:[],saHz};
  for(const i of voiced) res.track.push([i*dt,c[i]]);
  if(dur<3 || voiced.length*dt<2){ res.tips.push('We couldn’t hear enough singing. Hold the device closer and sing a little louder.'); return res; }
  // segments of steady pitch
  const segs=[]; let cur=null;
  for(let i=0;i<c.length;i++){ const v=c[i]; if(!isNaN(v) && cur && Math.abs(v-c[i-1])<35){ cur.v.push(v); } else { if(cur && cur.v.length>=3) segs.push(cur); cur= isNaN(v)?null:{s:i,v:[v]}; } }
  if(cur && cur.v.length>=3) segs.push(cur);
  if(!segs.length){ res.tips.push('The notes were very short or unclear. Try sustaining each swara a little.'); return res; }
  const notes=segs.map(g=>{ const s=[...g.v].sort((a,b)=>a-b); const m=s[Math.floor(s.length/2)]; const mean=g.v.reduce((a,b)=>a+b,0)/g.v.length; const sd=Math.sqrt(g.v.reduce((a,b)=>a+(b-mean)**2,0)/g.v.length); return {t:g.s*dt,dur:g.v.length*dt,m,sd}; });
  // octave auto-detect: octave holding most Sa
  const oct={}; for(const n of notes){ const cls=((n.m%1200)+1200)%1200; if(cls<60||cls>1140){ const o=Math.round(n.m/1200); oct[o]=(oct[o]||0)+n.dur; } }
  let mid=0; const ok=Object.entries(oct).sort((a,b)=>b[1]-a[1]); if(ok.length){ mid=+ok[0][0]; if((oct[0]||0)>=0.25*ok[0][1]) mid=0; } else { const ms=notes.map(n=>n.m).sort((a,b)=>a-b); mid=Math.round((ms[Math.floor(ms.length/2)]-600)/1200); }
  res.saHz=saHz*Math.pow(2,mid); res.octShift=mid;
  let tot=0,inR=0,absDev=0,inDur=0,sdSum=0; const per={}, outN={}; let minC=1e9,maxC=-1e9;
  for(const n of notes){ const m=n.m-mid*1200; const cls=((m%1200)+1200)%1200; const near=nearest(cls,allowed); tot+=n.dur; sdSum+=n.sd*n.dur; minC=Math.min(minC,m); maxC=Math.max(maxC,m);
    if(Math.abs(near.dev)<=50){ inR+=n.dur; absDev+=Math.abs(near.dev)*n.dur; inDur+=n.dur; const p=per[near.n]||(per[near.n]={d:0,w:0}); p.d+=near.dev*n.dur; p.w+=n.dur; } else { const any=nearest(cls,Object.keys(SW)); if(Math.abs(any.dev)<=35) outN[any.n]=(outN[any.n]||0)+n.dur; } }
  res.track=res.track.map(([t,v])=>[t,v-mid*1200]);
  res.inRaga=inR/tot; res.meanDev=inDur?absDev/inDur:50; res.stab=sdSum/tot; res.minC=minC; res.maxC=maxC;
  res.per=Object.fromEntries(Object.entries(per).map(([k,p])=>[k,{dev:Math.round(p.d/p.w),sec:+p.w.toFixed(1)}]));
  res.saDev=per.S?per.S.d/per.S.w:null; res.paDev=per.P?per.P.d/per.P.w:null;
  const sIn=clamp((res.inRaga-0.6)/0.35), sDev=clamp(1-(res.meanDev-8)/35), sSa=res.saDev==null?sDev:clamp(1-(Math.abs(res.saDev)-5)/40), sSt=clamp(1-(res.stab-8)/30);
  const worst=Math.max(0,...Object.values(res.per).filter(p=>p.sec>=0.3).map(p=>Math.abs(p.dev)));

  REC.mr=new MediaRecorder(REC.stream, mt?{mimeType:mt}:undefined); REC.chunks=[]; REC.mr.ondataavailable=e=>{ if(e.data.size) REC.chunks.push(e.data); }; REC.mr.start(1000); REC.t0=now();

function tunerUpdate(f,allowed){ const sw=$('#tSw'),nd=$('#tNeedle'),ce=$('#tCents'); if(!sw) return; if(!f){ sw.textContent='–'; ce.textContent=''; return; } const c=1200*Math.log2(f/(S.settings.sa||392)); const cls=((c%1200)+1200)%1200; const nr=nearest(cls,allowed||Object.keys(SW)); sw.textContent=SWN[nr.n]; nd.style.left=(50+clamp(nr.dev/50,-1,1)*48)+'%'; ce.textContent=(nr.dev>0?'+':'')+Math.round(nr.dev)+'¢'; sw.style.color=Math.abs(nr.dev)<15?'var(--green)':Math.abs(nr.dev)<30?'var(--amber)':'var(--red)'; }

const SELF={got:0.85,shaky:0.55,not:0.2};
function itemAttempts(id){ return Object.values(S.attempts).filter(a=>a.item===id&&!a.del).sort((a,b)=>b.ts-a.ts); }
function itemScore(id){
  const at=itemAttempts(id); if(!at.length) return {s:0,lv:'new',last:null};
  const prep=at.find(a=>a.self); const mock=at.find(a=>a.mode==='mock' && (a.unprepared || a.pm!=null));
  const sh=at.filter(a=>a.shruti?.score!=null).slice(0,3).map(a=>a.shruti.score/100); const shA=sh.length?sh.reduce((x,y)=>x+y,0)/sh.length:null;

}
const LVN={new:'Not started',learning:'Learning',shaky:'Almost',ready:'Ready'};
function factKeys(){ const k=[]; for(const id of Object.keys(COMPS)) for(const f of FACTS) k.push(id+':'+f); return k; }
function factScore(key){ const r=Object.values(S.facts).filter(f=>f.key===key).sort((a,b)=>b.ts-a.ts).slice(0,2); if(!r.length) return null; return r.reduce((x,y)=>x+y.v,0)/r.length; }
function guruScore(){ const r=Object.values(S.facts).filter(f=>f.key==='guru').sort((a,b)=>b.ts-a.ts)[0]; return r?r.v:0; }
function metrics(){
  const sc=Object.fromEntries(ITEMS.map(i=>[i.id,itemScore(i.id)]));
  const fk=factKeys(); const fs=Object.fromEntries(fk.map(k=>[k,factScore(k)]));
  const itemAvg=ITEMS.reduce((a,i)=>a+sc[i.id].s,0)/ITEMS.length; const factAvg=fk.reduce((a,k)=>a+(fs[k]??0),0)/fk.length;
  const competency=Math.round(100*(0.85*itemAvg+0.15*factAvg));

  for(const s of SECTIONS){ const its=ITEMS.filter(i=>i.sec===s.id).map(i=>sc[i.id].s); const best=Math.max(...its), mean=its.reduce((a,b)=>a+b,0)/its.length; secR[s.id]=s.mk*(s.sc*best+s.ec*mean); ready+=secR[s.id]; }
  const fav=f=>{ const v=Object.keys(COMPS).map(id=>fs[id+':'+f]??0); return v.reduce((a,b)=>a+b,0)/v.length; };
  const oral=0.5*fav('raga')+1*fav('tala')+0.5*fav('raga')+1*fav('aro')+0.5*fav('comp')+0.5*fav('bhasha')+1*guruScore();
  const lastM=Object.values(S.mocks).filter(m=>m.ideals!=null).sort((a,b)=>b.ts-a.ts)[0];
  const ideals=lastM?lastM.ideals:0;
  const readiness=Math.round((ready+oral+ideals)*2)/2;

  const oralMocked=fk.filter(k=>Object.values(S.facts).some(f=>f.key===k&&f.mode==='mock')).length;

}

function pickWeighted(arr,w,k){ const out=[]; const pool=arr.map((x,i)=>({x,w:w[i]})); while(out.length<k&&pool.length){ const tot=pool.reduce((a,b)=>a+b.w,0); let r=Math.random()*tot; let j=0; for(;j<pool.length-1;j++){ r-=pool[j].w; if(r<=0) break; } out.push(pool[j].x); pool.splice(j,1); } return out; }
function buildMock(type){
  const M=metrics(); const steps=[]; const t=now();
  if(type!=='oral') for(const s of SECTIONS){
    const its=ITEMS.filter(i=>i.sec===s.id).map(i=>i.id);
    const w=its.map(id=>{ const sc=M.sc[id]; const lm=itemAttempts(id).find(a=>a.mode==='mock'); const days=lm?(t-lm.ts)/86400000:20; return 1+2*(1-sc.s)+Math.min(days,14)/7+(lm?0:2); });
    const ec=pickWeighted(its,w,s.ec);
    for(let k=0;k<s.sc;k++) steps.push({kind:'prac',sec:s.id,sc:true,exclude:ec});
    for(const id of ec) steps.push({kind:'prac',sec:s.id,sc:false,item:id});
  }
  if(type!=='practical'){
    const comps=Object.keys(COMPS); const wf=f=>comps.map(id=>1+2*(1-(M.fs[id+':'+f]??0)));
    const byR={}; for(const id of comps){ const r=itemInfo(id).r; (byR[r]=byR[r]||[]).push(id); }
    const q1=pickWeighted(comps,wf('raga'),1)[0];
    steps.push({kind:'oral',q:'name',item:q1,max:0.5});
    steps.push({kind:'oral',q:'tala',item:pickWeighted(comps,wf('tala'),1)[0],max:1});
    steps.push({kind:'oral',q:'raga',item:pickWeighted(comps,wf('aro'),1)[0],max:1.5});
    const known=comps.filter(id=>itemInfo(id).c!=='Unknown'); steps.push({kind:'oral',q:'comp',item:pickWeighted(known,known.map(id=>1+2*(1-(M.fs[id+':comp']??0))),1)[0],max:0.5});
    steps.push({kind:'oral',q:'bhasha',item:pickWeighted(comps,wf('bhasha'),1)[0],max:0.5});
    steps.push({kind:'oral',q:'guru',max:1});
    steps.push({kind:'ideals',max:2});
  }
  return steps;
}

      if(st.q==='guru'){ q='Please tell us your Guru’s full name.'; ans=S.settings.guru||'(a parent can add the name in Parent › Settings)'; parts=[['Full name',0.5,'guru'],['Said respectfully with an honorific (Smt./Shri)',0.5,'guru']]; }
      body.innerHTML=`<div class="card flash"><div class="small mute">Oral · ${st.max} mark${st.max>1?'s':''}</div><div class="q">${esc(q)}</div><p class="small mute">Answer out loud, then tap Show answer.</p>${st.q==='tala'?`<button class="btn sm" id="otala">Open tāḷa helper after answering</button>`:''}<div class="a hide" id="oa" style="white-space:pre-line">${esc(ans)}</div><button class="btn primary" id="oshow">Show answer</button></div>
        <div class="card hide" id="omark"><h3>Mark each part</h3>${parts.map((p,j)=>`<label class="check"><input type="checkbox" data-j="${j}"><span>${esc(p[0])} <span class="mute">(${p[1]})</span></span></label>`).join('')}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="onext">Next</button></div></div>`;
      if($('#otala')) $('#otala').onclick=()=>openTala(it.tl);
      $('#oshow').onclick=()=>{ $('#oa').classList.remove('hide'); $('#oshow').classList.add('hide'); $('#omark').classList.remove('hide'); };
      $('#onext').onclick=()=>{ const fv={}; parts.forEach((p,j)=>{ const ok=$(`[data-j="${j}"]`).checked; if(ok) oralSum+=p[1]; if(p[2]){ (fv[p[2]]=fv[p[2]]||[]).push(ok?1:0); } });
        for(const [k,v] of Object.entries(fv)) put('facts',{id:uid(),key:k,v:v.reduce((a,b)=>a+b,0)/v.length,ts:now(),mode:'mock',mock:mock.id}); next(); };
    } else if(st.kind==='ideals'){
      const list=['Neat and well presented','Instrument / shruti box handled with care','Namaskāra at the start','Polite and respectful throughout','Followed every instruction'];
      body.innerHTML=`<div class="card"><h2>Ideals of an Indian Fine Arts Student (2 marks)</h2><p class="mute">Tick what was true today. Now do namaskāra to finish!</p>${list.map((l,j)=>`<label class="check"><input type="checkbox" data-k="${j}"><span>${l}</span></label>`).join('')}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="inext">Finish</button></div></div>`;
      $('#inext').onclick=()=>{ const n=[...view.querySelectorAll('[data-k]')].filter(x=>x.checked).length; mock.ideals=Math.round(2*n/5*2)/2; next(); };
    }
  };
  render();
}

/* ---- progress ---- */
function vProgress(){
  const M=metrics(); const mocks=Object.values(S.mocks).filter(m=>m.total!=null).sort((a,b)=>a.ts-b.ts);
  const notStarted=ITEMS.filter(i=>M.sc[i.id].lv==='new');
  view.innerHTML=`<h1>Progress</h1>
  <div class="grid2">
   <div class="card"><div class="mute small">Full syllabus competency</div><div class="big-n">${M.competency}%</div><div class="bar" style="margin:8px 0"><span style="width:${M.competency}%;background:var(--maroon)"></span></div><p class="small mute" style="margin:0">All 61 textbook items (85%) + oral facts (15%). Goal: mastery of everything, not just the minimum.</p></div>
   <div class="card"><div class="mute small">Exam readiness</div><div class="big-n">${M.readiness}<span style="font-size:22px">/50</span></div><p class="small mute" style="margin:6px 0 0">Expected score if the exam were today. Your choice uses your best item. The examiner’s choice could be any item, so weak items pull it down. Oral ${Math.round(M.oral*2)/2}/5 · conduct ${M.ideals}/2.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Preparation coverage</h3><div class="grid2" style="gap:10px">
   ${[['Tested in practical mocks',M.cov.practical],['Tested in oral mocks',M.cov.oral],['Tested in any mock',M.cov.full],['Touched in prep or mock',M.cov.touched],['Mastered (Ready)',M.cov.mastered]].map(([l,v])=>`<div><div class="spread small"><b>${l}</b><span>${v}%</span></div><div class="bar"><span style="width:${v}%;background:var(--gold)"></span></div></div>`).join('')}
  </div></div>
  <div class="card"><h3>By section</h3><table class="stack"><thead><tr><th>Section</th><th>Levels</th><th class="n">Ready</th><th class="n">Expected exam marks</th></tr></thead><tbody>${SECTIONS.map(s=>{ const its=ITEMS.filter(i=>i.sec===s.id); return `<tr><td><b>${esc(s.n)}</b></td><td style="width:40%">${levelBar(its.map(i=>M.sc[i.id].lv))}</td><td class="n">${its.filter(i=>M.sc[i.id].lv==='ready').length}/${its.length}</td><td class="n">${(Math.round(M.secR[s.id]*2)/2)} / ${s.mk*(s.sc+s.ec)}</td></tr>`; }).join('')}</tbody></table>
   <p class="small mute"><span class="pill lv-ready">Ready</span> <span class="pill lv-shaky">Almost</span> <span class="pill lv-learning">Learning</span> <span class="pill lv-new">Not started</span></p></div>
  <div class="card"><h3>Mock test scores</h3>${mocks.length?`<div class="fig" style="position:relative;height:160px"><svg id="mchart" style="position:absolute;inset:0;width:100%;height:100%"></svg></div>`:'<p class="mute">No rated mock tests yet.</p>'}</div>
  ${notStarted.length?`<div class="card"><h3>Not started yet (${notStarted.length})</h3><div class="items">${notStarted.map(i=>`<a class="item-chip" href="#item-${i.id}" style="text-decoration:none;color:inherit"><b>${esc(itemTitle(i.id))}</b></a>`).join('')}</div></div>`:''}`;
  const sv=$('#mchart'); if(sv){ const draw=()=>{ const W=sv.clientWidth,H=sv.clientHeight,P=28; const pts=mocks.map((m,j)=>[P+(W-2*P)*(mocks.length>1?j/(mocks.length-1):0.5),H-P-(H-2*P)*(m.total/m.max)]); sv.innerHTML=`<line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="#eadfcd"/><text x="2" y="${P}" font-size="11" fill="#6f5d52">100%</text><text x="2" y="${H-P}" font-size="11" fill="#6f5d52">0</text><polyline fill="none" stroke="#7a1e2c" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,j)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#7a1e2c"/><text x="${p[0]}" y="${p[1]-9}" font-size="11" text-anchor="middle" fill="#2a1a14">${mocks[j].total}/${mocks[j].max}</text>`).join('')}`; }; new ResizeObserver(draw).observe(sv); }
}

/* ---- parent ---- */
function vParent(){
  const pend=Object.values(S.mocks).filter(m=>m.needsRating).sort((a,b)=>b.ts-a.ts);
  const wk=now()-7*86400000; const ses=Object.values(S.sessions).filter(s=>s.start>wk); const mins=Math.round(ses.reduce((a,s)=>a+Math.min(120,(s.end-s.start)/60000),0));
  const at=Object.values(S.attempts).filter(a=>a.ts>wk); const items=new Set(at.map(a=>a.item)).size; const sh=at.filter(a=>a.shruti?.score!=null); const shA=sh.length?Math.round(sh.reduce((x,a)=>x+a.shruti.score,0)/sh.length):null;
  const days=new Set([...at,...Object.values(S.facts).filter(f=>f.ts>wk)].map(a=>dayKey(a.ts))).size; const M=metrics();
  view.innerHTML=`<h1>Parent</h1>
  <div class="card"><h3>Rate mock tests</h3>${pend.length?pend.map(m=>`<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${new Date(m.ts).toLocaleString()} · ${m.type} · ${m.attempts.length} items</span><a class="btn primary sm" href="#rate-${m.id}">Rate</a></div>`).join(''):'<p class="mute" style="margin:0">Nothing waiting.</p>'}</div>
  <div class="card"><h3>This week</h3><div class="grid2" style="gap:10px">${[['Practice days',days+'/7'],['Minutes practised',mins],['Items practised',items],['Mock tests',Object.values(S.mocks).filter(m=>m.ts>wk).length],['Avg shruti score',shA??'–'],['Exam readiness',M.readiness+'/50']].map(([l,v])=>`<div><div class="small mute">${l}</div><div style="font-family:'Baloo 2';font-size:28px;font-weight:700">${v}</div></div>`).join('')}</div></div>
  <div class="grid2"><a class="card" href="#links" style="text-decoration:none;color:inherit;margin:0"><h3>Recording links</h3><p class="mute small" style="margin:0">${ITEMS.filter(i=>!videoLinks(i.id).length).length} items have no recording. Add YouTube or other links.</p></a>
  <a class="card" href="#settings" style="text-decoration:none;color:inherit;margin:0"><h3>Settings & Drive</h3><p class="mute small" style="margin:0">Google Drive, Guru name, shruti, Bhajan, backup</p></a></div>`;
}
function vRate(mid){
  const m=S.mocks[mid]; if(!m){ location.hash='#parent'; return; }
  const ats=m.attempts.map(id=>S.attempts[id]).filter(Boolean);
  view.innerHTML=`<a href="#parent" class="small">← Parent</a><h1 style="margin-top:6px">Rate mock test</h1><p class="mute">${new Date(m.ts).toLocaleString()} · ${m.type}. Listen to each item and give marks the way the examiner would. Remarks must say why marks were taken off.</p>
  ${ats.map(a=>{ const it=itemInfo(a.item); const s=SEC[it.sec]; return `<div class="card" data-a="${a.id}"><div class="spread"><div><div class="small mute">${esc(s.n)} · ${a.sc?'student’s choice':'examiner’s choice'}</div><h3 style="margin:2px 0">${esc(it.t)}</h3></div>${a.unprepared?'<span class="pill lv-learning">Not prepared · 0</span>':ringSvg(a.shruti?.score??null).replace('class="score-ring"','class="score-ring" style="width:64px;height:64px"')}</div>
   ${a.unprepared?'':`<div class="aud small mute">Loading recording…</div>${a.shruti?.tips?`<div class="small mute">${a.shruti.tips.map(esc).join(' · ')}</div>`:''}
   <div class="spread" style="margin-top:10px"><b>Marks (max ${a.max})</b><div class="stepper"><button data-d="-0.5" aria-label="less">−</button><output>${a.pm??a.max}</output><button data-d="0.5" aria-label="more">+</button></div></div>
   <div class="items" style="margin-top:8px">${REMARKS.map(r=>`<button class="chip rm" style="background:#f3ece1;color:var(--ink)" aria-pressed="${(a.rm||[]).includes(r)}">${esc(r)}</button>`).join('')}</div>
   <input type="text" class="rtxt" placeholder="Specific remark (e.g. lost tāḷa in 3rd speed)" value="${esc(a.rtxt||'')}" style="margin-top:8px">`}</div>`; }).join('')}
  <button class="btn primary big" id="rsave">Save ratings</button>`;
  view.querySelectorAll('[data-a]').forEach(async card=>{ const a=S.attempts[card.dataset.a]; if(a.unprepared) return;
    const out=$('output',card); card.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ out.textContent=clamp(+out.textContent+ +b.dataset.d,0,a.max); });
    card.querySelectorAll('.rm').forEach(b=>{ const upd=()=>{ const on=b.getAttribute('aria-pressed')==='true'; b.style.background=on?'var(--gold)':'#f3ece1'; }; upd(); b.onclick=()=>{ b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'); upd(); }; });
    const aud=$('.aud',card); try{ const u=await audioUrl(a); aud.innerHTML= u?`<audio controls src="${u}" style="width:100%"></audio>`: a.audio?.deleted?'Recording removed (only the latest 2 per item are kept).':'Recording is in Google Drive. Connect Drive (top bar) to play it.'; }catch(e){ aud.textContent='Could not load recording.'; } });
  $('#rsave').onclick=()=>{ let prac=0;
    for(const card of view.querySelectorAll('[data-a]')){ const a=S.attempts[card.dataset.a]; if(!a.unprepared){ a.pm=+$('output',card).textContent; a.rm=[...card.querySelectorAll('.rm')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.textContent); a.rtxt=$('.rtxt',card).value.trim(); a.ratedAt=now(); put('attempts',a); prac+=a.pm; } }
    m.prac=Math.round(prac*2)/2; m.needsRating=false; m.total=m.prac+(m.oral||0)+(m.ideals||0); put('mocks',m); toast('Ratings saved: '+m.total+'/'+m.max); location.hash='#parent'; };
}
function vLinks(){
  view.innerHTML=`<a href="#parent" class="small">← Parent</a><h1 style="margin-top:6px">Recording links</h1><p class="mute">Add links for items that have no recording, or extra ones (YouTube, Drive, any https link).</p>
  <div class="card"><label class="f" for="lItem">Item</label><select id="lItem">${SECTIONS.map(s=>`<optgroup label="${esc(s.n)}">${ITEMS.filter(i=>i.sec===s.id).map(i=>`<option value="${i.id}">${esc(itemTitle(i.id))}${videoLinks(i.id).length?'':' (none yet)'}</option>`).join('')}</optgroup>`).join('')}</select>
  <div id="lList" style="margin:12px 0"></div>
  <label class="f" for="lUrl">Link (https://…)</label><input type="url" id="lUrl" placeholder="https://www.youtube.com/watch?v=…">
  <label class="f" for="lLab">Label (optional)</label><input type="text" id="lLab" placeholder="e.g. Guru’s recording, starts at 2:10">
  <div class="row" style="margin-top:12px"><button class="btn primary" id="lAdd">Add link</button></div></div>`;
  const list=()=>{ const id=$('#lItem').value; const it=ITEM[id]; const built=(it.v||[]).map(v=>`<div class="spread small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>▶ Sangeeta Bhārati video (built in)</span></div>`).join(''); const ex=Object.values(S.links).filter(l=>l.item===id&&!l.del).map(l=>`<div class="spread small" style="padding:6px 0;border-bottom:1px solid var(--line)"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a><button class="btn ghost sm" data-del="${l.id}">Remove</button></div>`).join(''); $('#lList').innerHTML=built+ex||'<p class="mute small">No recordings yet.</p>'; view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const l=S.links[b.dataset.del]; l.del=true; put('links',l); list(); }); };
  $('#lItem').onchange=list; list();
  $('#lAdd').onclick=()=>{ const url=$('#lUrl').value.trim(); if(!/^https:\/\//.test(url)){ toast('Please enter a link starting with https://'); return; } put('links',{id:uid(),item:$('#lItem').value,url,label:$('#lLab').value.trim()}); $('#lUrl').value=''; $('#lLab').value=''; list(); toast('Link added'); };
}
function vSettings(){
  const st=S.settings; const b=st.bhajan||{t:COMPS['bhajan-1'].t,r:'hamsadhvani',tl:'eka',c:'Unknown',b:'Sanskrit'};
  view.innerHTML=`<a href="#parent" class="small">← Parent</a><h1 style="margin-top:6px">Settings</h1>
  <div class="card"><h3>Google Drive</h3><p class="small mute">Progress is saved on this device first, then synced to <b>My Drive › Sangeeta Prep</b> (progress.json, daily snapshots, recordings). The app can only see files it created.</p>
   <label class="f" for="cid">Google OAuth Client ID</label><input type="text" id="cid" value="${esc(clientId())}" ${CONFIG.clientId?'disabled':''} placeholder="xxxx.apps.googleusercontent.com">
   <div class="row" style="margin-top:10px"><button class="btn primary" id="cidSave">${tokenOk()?'Sync now':'Save & connect'}</button><span class="small mute">${DRIVE.last?'Last sync '+ago(DRIVE.last):''}${DRIVE.err?' · '+esc(DRIVE.err):''}</span></div></div>
  <div class="card"><h3>Student</h3><label class="f" for="guru">Guru’s name (as she should say it)</label><input type="text" id="guru" value="${esc(st.guru||'')}">
   <label class="f" for="sa">Shruti: Sa frequency (Hz)</label><select id="sa">${[['G3 · 196 Hz',196],['G#3 · 207.7 Hz',207.65],['G4 · 392 Hz',392],['G#4 · 415.3 Hz',415.3]].map(([l,v])=>`<option value="${v}" ${+st.sa===v?'selected':''}>${l}</option>`).join('')}</select><p class="small mute">The analysis detects the octave automatically. This also sets the tanpura pitch.</p>
   <label class="f" for="tvol">Tanpura volume</label><input type="range" id="tvol" min="0.1" max="1" step="0.05" value="${+ls.get('sp_tvol')||0.7}" style="width:100%"></div>
  <div class="card"><h3>Bhajan</h3><label class="f" for="bt">Title</label><input type="text" id="bt" value="${esc(b.t)}">
   <div class="grid2" style="gap:10px"><div><label class="f" for="br">Rāga</label><select id="br">${Object.entries(RAGAS).map(([k,v])=>`<option value="${k}" ${k===b.r?'selected':''}>${esc(v.n)}</option>`).join('')}</select></div><div><label class="f" for="btl">Tāḷa</label><select id="btl">${Object.entries(TALAS).map(([k,v])=>`<option value="${k}" ${k===b.tl?'selected':''}>${esc(v.n)}</option>`).join('')}</select></div>
   <div><label class="f" for="bc">Composer</label><input type="text" id="bc" value="${esc(b.c)}"></div><div><label class="f" for="bb">Language</label><input type="text" id="bb" value="${esc(b.b)}"></div></div></div>
  <div class="row"><button class="btn primary big" id="sSave">Save settings</button></div>
  <div class="card" style="margin-top:14px"><h3>Backup</h3><p class="small mute">Extra safety on top of Drive: download all progress as a file, or restore one (it’s merged, nothing is lost).</p><div class="row"><button class="btn" id="exp">Download backup</button><label class="btn" for="imp">Restore from file</label><input type="file" id="imp" accept="application/json,.json" class="hide"></div></div>`;
  $('#cidSave').onclick=async()=>{ const v=$('#cid').value.trim(); if(!CONFIG.clientId){ if(!/apps\.googleusercontent\.com$/.test(v)){ toast('That doesn’t look like a Client ID'); return; } ls.set('sp_clientId',v); } renderSync(); if(tokenOk()) sync(); else await connectDrive(true); };
  $('#tvol').oninput=e=>{ ls.set('sp_tvol',e.target.value); if(tanpura.gain) tanpura.gain.gain.value=+e.target.value; };
  $('#sSave').onclick=()=>{ const bh={t:$('#bt').value.trim()||COMPS['bhajan-1'].t,r:$('#br').value,tl:$('#btl').value,c:$('#bc').value.trim()||'Unknown',b:$('#bb').value.trim()||'Sanskrit'};
    S.settings={...S.settings,guru:$('#guru').value.trim(),sa:+$('#sa').value,bhajan:bh,u:now()}; persist(); if(tanpura.on){ tanpuraStop(); tanpuraStart(); } toast('Saved'); };
  $('#exp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})); a.download='sangeeta-prep-backup-'+dayKey(now())+'.json'; document.body.appendChild(a); a.click(); a.remove(); };
  $('#imp').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); S=mergeState(S,d); persist(); toast('Backup merged'); }catch(err){ toast('Could not read that file'); } };
}

/* ====================== BOOT ====================== */
(async()=>{
  try{ db=await idb(); const saved=await iget('kv','state'); if(saved) S=mergeState(blankState(),saved); }catch(e){ console.error(e); view.innerHTML='<div class="banner warn">This browser blocked on-device storage (private mode?). Progress will only be saved to Google Drive.</div>'; }
  try{ const t=JSON.parse(ls.get('sp_tok')||'null'); if(t&&t.e>now()){ DRIVE.token=t.t; DRIVE.exp=t.e; } }catch(e){}
  try{ navigator.storage?.persist?.(); }catch(e){}
  renderSync(); route(); if(tokenOk()) sync();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.__SP={S:()=>S,analyzeSamples,ITEMS,metrics};
})();
}
